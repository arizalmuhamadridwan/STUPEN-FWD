<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tugas 5 JS</title>
  <style>
    body {
        background-color: #1e1e1e;
        font-family: Arial, sans-serif;
        color: #e0e0e0;
    }

    #heading{
        text-align: center;
    }

    #contain {
        display: flex;
        justify-content: space-around;  
        align-items: center;      
        width: 100%; 
    }

    #tampil, #tambah, #hapus {
        font-weight: bolder;
        padding: 10px;
        border-radius: 10px;
        border-color: #1e1e1e;
    }

    #tampil:hover, #tambah:hover, #hapus:hover{
        color: #e0e0e0;
        background-color: #1e1e1e;
        border-color: #e0e0e0;
    }

    #output{
        text-align: center;
    }
  </style>
</head>
<body>
  <h1 id="heading">Daftar Produk <br> Toko Atul Dirgantara</h1>
  <hr>
  <div id="contain">
    <div>
        <button id="tampil">Tampilkan Produk</button>
    </div>
    <div>
        <button id="tambah">Tambah Produk</button>
    </div>
    <div>
        <button id="hapus">Hapus Produk</button>
    </div>
  </div>

  <pre id="output"></pre>

  <script>
    let produkList = [
      { id: 1, nama: "Pensil", harga: 5000 },
      { id: 2, nama: "Penghapus", harga: 3000 },
      { id: 3, nama: "Serutan", harga: 20000 },
      { id: 4, nama: "Buku", harga: 7000 },
      { id: 5, nama: "Penggaris", harga: 1000 }
    ];

    function tampilkanProduk() {
      let teks = "======== Daftar Produk ========\n";
      produkList.forEach(({id, nama, harga}) => { 
        teks += `${id}. ${nama} - Rp${harga}\n`;
      });
      document.getElementById("output").textContent = teks;
    }


    function tambahProduk(...produkBaru) {
      produkList = [...produkList, ...produkBaru];
      tampilkanProduk();
    }

    function hapusProduk(id) {
      produkList = produkList.filter(p => p.id !== id);
      tampilkanProduk();
    }


    document.getElementById("tampil").addEventListener("click", tampilkanProduk);

    document.getElementById("tambah").addEventListener("click", () => {
      tambahProduk({id: 6, nama: "Spidol", harga: 6000});
    });

    document.getElementById("hapus").addEventListener("click", () => {
      hapusProduk(2);
    });
  </script>
</body>
</html>
