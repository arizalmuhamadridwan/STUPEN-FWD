<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Perhitungan bangun</title>
  <style>
    /*  Style untuk Membantu tampilan agar mudah di pahami    */
    body{
      margin-left: 100px;
      margin-right: 100px;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    h3{
      margin-bottom: 0px;
    }

    #input_hitung{
      border: 2px solid black;
      border-radius: 40px 40px 0 0;
      padding: 15px;
      width: 300px;
      margin: auto;
    }

    #hasil{
      border: 2px solid black;
            border-radius: 0 0 40px 40px ;
      padding: 15px;
      width: 300px;
      margin: auto;
    }

    button{
      padding: 5px;
      border-radius: 5px;
    }

    button:hover{
      background-color: black;
      color: white;
    }
  </style>
</head>
<body>
  <h2 align="center">Kalkulator bangun datar</h2>
<!--  Form untuk melakukan input dengan 3 bangun datar persegi panjang, Bujur Sangkar, dan Segitiga  -->
  <form id="input_hitung">
    <h3 >Persegi Panjang</h3>
    <label for="">Panjang:</label> 
    <br><input type="number" placeholder="masukkan panjang" id="panjang"><br>
    <label for="">Lebar:</label> 
    <br><input type="number" placeholder="masukkan lebar" id="lebar"><br><br>

    <h3>Bujur Sangkar</h3>
    <label for="">Sisi:</label>
    <br><input type="number" placeholder="masukkan sisi" id="sisi"><br><br>

    <h3>Segitiga</h3>
    <label for="">Alas:</label>
    <br><input type="number" placeholder="masukkan alas" id="alas"><br>
    <label for="">Tinggi:</label> 
    <br><input type="number" placeholder="masukkan tinggi" id="tinggi"><br><br>
    <button type="button" onclick="hitung()">Hitung</button>
  </form>
<!--   Untuk membuat ruang hasil perhitungan -->
  <div id="hasil"></div>

  <script>
    // Membuat rumus untuk tiap bangun datar
    function luasPersegiPanjang(panjang, lebar) {
      return panjang * lebar;
    }

    function luasBujurSangkar(sisi) {
      return sisi * sisi;
    }

    function luasSegitiga(alas, tinggi) {
      return 0.5 * alas * tinggi;
    }
    // untuk mengubah data input menjadi float dan juga mengisi 0 apabila user tidak melakukan input
    function hitung() {
      let panjang = parseFloat(document.getElementById("panjang").value) || 0;
      let lebar   = parseFloat(document.getElementById("lebar").value) || 0;
      let sisi    = parseFloat(document.getElementById("sisi").value) || 0;
      let alas    = parseFloat(document.getElementById("alas").value) || 0;
      let tinggi  = parseFloat(document.getElementById("tinggi").value) || 0;

      // membuat logika untuk bagian hasil
      document.getElementById("hasil").innerHTML = `
        <b>Hasil Perhitungan Bangun Satar:</b><br>
        Luas Persegi Panjang ${luasPersegiPanjang(panjang, lebar)} <br>
        Luas Bujur Sangkar ${luasBujurSangkar(sisi)} <br>
        Luas Segitiga ${luasSegitiga(alas, tinggi)}
      `;
    }
  </script>
</body>
</html>
